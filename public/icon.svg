<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Osusume app icon: torii gate, outline only (Apple-style glyph on dark squircle) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <!-- userSpaceOnUse: objectBoundingBox gradients silently fail on straight
         lines (zero-area bbox) — the beams would vanish -->
    <linearGradient id="stroke" x1="0" y1="220" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7c2ff"/>
      <stop offset="1" stop-color="#9f92ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g fill="none" stroke="url(#stroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- kasagi: curved top lintel, ends lifted (glyph centered on 512) -->
    <path d="M186 272 Q 512 202, 838 272"/>
    <!-- gakuzuka: center strut between kasagi and shimaki -->
    <path d="M512 262 V 376"/>
    <!-- shimaki: second beam -->
    <path d="M250 376 H 774"/>
    <!-- pillars -->
    <path d="M312 376 V 786"/>
    <path d="M712 376 V 786"/>
    <!-- nuki: crossing beam -->
    <path d="M236 548 H 788"/>
  </g>
</svg>
